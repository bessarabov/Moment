name: CI
on: [push]

jobs:
  devcontainer-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Dev Container and run tests
        uses: devcontainers/ci@v0.3
        with:
          subFolder: .
          runCmd: |
            prove -l t/
            prove -l xt/
